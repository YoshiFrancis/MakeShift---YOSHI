name: Frontend CI

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - "tests/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "frontend/**"
      - "tests/frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Check WCAG color contrast
        run: npm run test:contrast

      - name: Upload color contrast evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-report
          path: frontend/test-results/contrast-report.json

      - name: Build
        run: npm run build
