name: Frontend CI

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - "tests/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "frontend/**"
      - "tests/frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Check WCAG color contrast
        run: npm run test:contrast

      - name: Upload color contrast evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-report
          path: frontend/test-results/contrast-report.json

      - name: Build
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      # ubuntu-latest already provides Chromium's system libraries.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Start production server
        run: |
          npm start -- -p 3000 > next-start.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && exit 0
            sleep 1
          done
          cat next-start.log
          exit 1

      - name: Deployment smoke test
        run: npm run test:deployment

      - name: Browser audio smoke test
        env:
          AUDIO_BROWSER_CHANNEL: chromium
        run: npm run test:audio-browser
